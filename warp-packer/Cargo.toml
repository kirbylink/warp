[package]
name = "warp-packer"
version = "1.3.0"
authors = ["Diego Giagio <diego@giagio.com>", "Reisz", "kirbylink"]
edition = "2021"

[dependencies]
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
lazy_static = "1.5.0"
rayon = "1.10"
tempdir = "0.3.7"
uuid = { version = "1.21", features = ["v4"] }
warp-args = { path = "../warp-args" }
zstd = "0.13"
